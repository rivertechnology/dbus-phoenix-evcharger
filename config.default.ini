[DEFAULT]
# VRM / D-Bus device instance
DeviceInstance=60
CustomName=Laadpaal

# Victron position: 0 = AC-uitgang (achter de Multi/Quattro), 1 = AC-ingang (netzijde)
Position=0

# Berekening vermogen: setpoint-stroom x Voltage x Phases (alleen in CP-state C/D)
Phases=3
Voltage=230
# Correctie: de auto trekt iets minder dan het setpoint (alleen voor de berekening,
# naar de laadpaal wordt het ingestelde aantal ampere geschreven)
CurrentFactor=0.95

# Grenzen voor de stroom (ampere); Auto regelt tussen MinCurrent en MaxCurrent
MinCurrent=6
MaxCurrent=16
# Stroom in Manual-modus bij opstarten; een waarde die je in de GUI kiest wordt onthouden
DefaultCurrent=10

# Wat /Ac/Energy/Forward toont: total = doorlopende teller, session = per laadsessie
EnergyForward=total

PollIntervalMs=2000
FailuresBeforeDisconnect=3

# CRITICAL, ERROR, WARNING, INFO, DEBUG
Logging=INFO

[MODBUS]
Host=192.168.178.108
Port=502
UnitId=180
TimeoutSeconds=2.0

# Phoenix Contact EM-CP-PP-ETH
StatusInputRegister=100
CurrentHoldingRegister=300
EnableCoil=400

[METER]
# Eastron SDM72D-M (MID) via een Modbus TCP gateway (RS485 -> TCP).
# Host leeg = geen meter: vermogen en kWh worden dan berekend.
# Met meter komen vermogen, stroom, spanning en de kWh-teller (totaal import)
# rechtstreeks uit de meter; CurrentFactor/Voltage worden dan niet gebruikt.
Host=
Port=502
# Modbus-adres van de meter (standaard 1), gateway op 9600 8N1
UnitId=1
TimeoutSeconds=2.0
# Volgorde van de twee registers per float: big (standaard Eastron) of little
WordOrder=big
# Input registers (float32): blok V1-3/I1-3/P1-3, totaal vermogen, totaal import kWh
PhaseBlockRegister=0
TotalPowerRegister=52
EnergyRegister=72

[AUTO]
# Auto-modus (Mode = Auto in de GUI): laden op PV-overschot.
# Overschot = teruglevering + wat de auto al trekt (+ accu-laadvermogen boven MinSoc).
# Minimum laadvermogen = MinCurrent x CurrentFactor x Voltage x Phases (~3930 W bij 6 A, 3 fasen).

# Starten bij dit overschot (0 = minimum laadvermogen + 300 W)
StartSurplusWatts=0
# Overschot moet zo lang aanhouden voordat er gestart wordt
StartDelaySeconds=60
# Hoeveel netafname/accu-ontlading op minimum stroom toegestaan is voordat de stoptimer loopt
StopImportWatts=500
StopDelaySeconds=600
# Minimale laadtijd na een start, en minimale pauze na een stop
MinRuntimeSeconds=900
MinOfftimeSeconds=600
# Stroom maximaal zo vaak bijstellen
AdjustIntervalSeconds=60
# Demping van het overschot (0..1, lager = rustiger)
SmoothingAlpha=0.3

# Accu meenemen: laadvermogen van de accu telt als overschot (alleen boven MinSoc),
# ontladen telt altijd tegen. Onder MinSoc wordt niet gestart en wel gestopt.
UseBattery=1
MinSoc=40
